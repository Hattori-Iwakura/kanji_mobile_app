name: kanji_mobile_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  
  # Networking
  dio: ^5.7.0
  http: ^1.2.2
  
  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  
  # Audio
  audioplayers: ^5.2.1
  
  # SVG
  flutter_svg: ^2.0.10
  path_drawing: ^1.0.1
  
  # Dependency Injection
  get_it: ^8.0.2
  
  # Functional Programming
  dartz: ^0.10.1
  
  # Environment variables
  flutter_dotenv: ^5.2.1
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Animations
  flip_card: ^0.7.0
  animations: ^2.0.11
  
  # Charts
  fl_chart: ^0.69.0
  
  # Image Picker
  image_picker: ^1.1.2
  
  # Smart Auth (Auto-fill OTP)
  smart_auth: ^1.1.1
  
  # Translation
  translator: ^1.0.0
  
  # Text to Speech
  flutter_tts: ^4.1.0
  
  # Speech to Text
  speech_to_text: ^7.0.0
  
  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  
  # Include .env file
  assets:
    - .env
